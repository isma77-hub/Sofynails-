<style>
:root{--bg:#f3ece1;--surf:#fffaf2;--ink:#181513;--mut:#7a6f62;--gold:#b8975a;--gold2:#d9c08f;--blk:#14110f;--line:#e4d8c4}
@media (prefers-color-scheme:dark){:root{--bg:#0f0d0b;--surf:#1a1613;--ink:#f3ece1;--mut:#a69a89;--line:#2e2822}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Helvetica Neue",Arial,sans-serif;max-width:430px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
h2,h3,.logo{font-family:Georgia,"Times New Roman",serif;font-weight:500;margin:0}
#app{padding:16px 18px 110px}
.lg{display:block;width:200px;max-width:62%;margin:0 auto;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}.lg.s{width:84px;max-width:none;margin:0;border-radius:14px;box-shadow:none}
.logo{letter-spacing:.28em;color:var(--gold);font-size:22px;text-align:center}
.logo small{display:block;font-size:10px;letter-spacing:.35em;margin-top:2px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:var(--blk);color:var(--gold2);font-size:16px;margin-top:14px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--gold);box-shadow:none}
.btn[disabled]{opacity:.4}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 4px 14px rgba(60,40,10,.06)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:14px}.gold{color:var(--gold)}
h2{font-size:28px;margin:14px 0 4px}h3{font-size:21px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.chip{flex:0 0 auto;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:15px;min-width:56px}
.chip.on{background:var(--blk);color:var(--gold2);border-color:var(--gold)}
.chip[disabled]{opacity:.35;text-decoration:line-through}
.sv{width:100%;text-align:left;color:var(--ink);font:inherit}.sv.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surf);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:6px 0}nav button.on{color:var(--gold)}
nav i{display:block;font-style:normal;font-size:20px}
.vc{background:linear-gradient(135deg,#1c1713,#0d0b09);color:var(--gold2);border-radius:20px;padding:20px;border:1px solid var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.3);margin-top:14px}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
.st{aspect-ratio:1;border-radius:50%;border:1px dashed var(--gold);display:grid;place-items:center;font-size:18px;color:var(--gold2)}
.st.f{background:var(--gold);color:#14110f;border:0}
.bar{height:6px;border-radius:6px;background:#3a3126;overflow:hidden}.bar b{display:block;height:100%;background:var(--gold2)}
input{width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:16px;margin-top:10px}
.msg{background:var(--blk);color:var(--gold2);padding:12px;border-radius:12px;text-align:center;margin-top:12px}

const logo='<img class="lg" src="'+LOGO+'" alt="Sofy Nails Manicuría">';
const logoS='<img class="lg s" src="'+LOGO+'" alt="Sofy Nails Manicuría">';
const name=()=>esc((st.p&&st.p.nombre)||'')||'';
function go(t){st.tab=t;st.msg='';render();if(t=='adm')admLoad()}
async function load(){
 if(!st.u){st.ready=true;return render()}
 const [s,t,m,p]=await Promise.all([
  sb.from('servicios').select('*').eq('activo',true).order('id'),
  sb.from('turnos').select('id,inicio,estado,servicios(nombre,precio)').order('inicio',{ascending:false}),
  sb.from('sellos_movimientos').select('cantidad'),
  sb.from('profiles').select('*').eq('id',st.u.id).maybeSingle()]);
 st.svcs=s.data||[];st.trn=t.data||[];st.n=Math.max(0,(m.data||[]).reduce((a,x)=>a+x.cantidad,0));st.p=p.data;st.adm=!!(p.data&&p.data.es_admin);
 st.ready=true;render()}
sb.auth.onAuthStateChange((_e,s)=>{st.u=s?s.user:null;setTimeout(load,0)});
const google=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
const salir=async()=>{await sb.auth.signOut()};
async function pickDay(d){st.day=d;st.hr=null;const r=await sb.rpc('horarios_ocupados',{dia:d});st.occ=(r.data||[]).map(v=>new Date(v).toTimeString().slice(0,5));render()}
async function reservar(){
 const inicio=new Date(st.day+'T'+st.hr+':00').toISOString();
 const r=await sb.from('turnos').insert({cliente_id:st.u.id,servicio_id:st.svc,inicio});
 if(r.error){st.msg=r.error.code==='23505'?'Ese horario ya fue reservado. Elegí otro.':'No pudimos reservar. Probá de nuevo.';await pickDay(st.day);return}
 st.done=true;await load()}
async function cancelar(id){if(!confirm('¿Cancelar este turno?'))return;await sb.from('turnos').update({estado:'cancelado'}).eq('id',id);await load()}
async function guardar(){
 const r=await sb.from('profiles').update({nombre:$('pn').value.trim(),apellido:$('pa').value.trim(),telefono:$('pt').value.trim()}).eq('id',st.u.id);
 st.msg=r.error?'No se pudo guardar.':'Datos guardados.';await load()}
function card(){const n=Math.min(st.n,10);let h='<div class="vc">'+logoS+'<div class="serif" style="font-family:Georgia,serif;font-size:24px;margin-top:14px">'+(((st.p&&st.p.nombre)||'')+' '+((st.p&&st.p.apellido)||'')).trim().replace(/[&<>"]/g,'')+'</div><div style="color:var(--gold2)">'+n+' de 10 visitas</div><div class="stamps">';
 for(let i=1;i<=10;i++)h+='<div class="st '+(i<=n?'f':'')+'">'+(i<=n?'✓':(i==5||i==10?'★':''))+'</div>';
 return h+'</div><div class="bar"><b style="width:'+n*10+'%"></b></div><div style="margin-top:10px;font-size:14px">'+(n>=10?'¡Completaste tu tarjeta! Pedí tu recompensa.':n<5?'Te faltan '+(5-n)+' para tu primer beneficio':'Te faltan '+(10-n)+' para tu recompensa mayor')+'</div></div>'}
function view(){
 if(!st.ready)return'<div style="padding-top:30vh">'+logo+'</div>';
 if(!st.u)return'<div style="padding-top:10vh">'+logo+'<h2 style="text-align:center;margin-top:40px">Tu momento de cuidado</h2><p class="mut" style="text-align:center">Reservá tu turno y sumá sellos en cada visita.</p><button class="btn" onclick="google()">Continuar con Google</button><p class="mut" style="text-align:center;margin-top:18px">El registro con teléfono y SMS se suma en la próxima etapa.</p></div>';
 if(st.tab=='home')return logo+'<h2 style="margin-top:18px">Hola'+(name()?', '+name():'')+'</h2><p class="mut" style="margin:0">¿Cuándo querés tu próximo turno?</p><button class="btn" onclick="go(\'book\')">Reservar un turno</button><h3 style="margin-top:20px">Servicios</h3>'+st.svcs.map(x=>'<div class="card row"><div><b>'+esc(x.nombre)+'</b><div class="mut">'+x.duracion_min+' min</div></div><span class="gold">'+money(x.precio)+'</span></div>').join('')+'<div onclick="go(\'loy\')">'+card()+'</div>';
 if(st.tab=='book')return book();if(st.tab=='adm'&&st.adm)return adm();
 if(st.tab=='turns'){const f=new Date();return'<h2>Mis turnos</h2>'+(st.trn.length?st.trn.map(t=>'<div class="card"><div class="row"><b>'+esc(t.servicios?t.servicios.nombre:'')+'</b><span class="mut">'+({reservado:'Reservado',realizado:'Realizado',cancelado:'Cancelado'}[t.estado])+'</span></div><div class="mut">'+dt(t.inicio)+'</div>'+(t.estado=='reservado'&&new Date(t.inicio)>f?'<button class="btn alt" onclick="cancelar('+t.id+')">Cancelar turno</button>':'')+'</div>').join(''):'<div class="card mut">Todavía no tenés turnos.</div><button class="btn" onclick="go(\'book\')">Reservar un turno</button>')}
 if(st.tab=='loy')return'<h2>Tu tarjeta</h2>'+card()+'<p class="mut">Los sellos se suman cuando tu turno queda marcado como realizado.</p>';
 const p=st.p||{};return'<h2>Mi perfil</h2><input id="pn" placeholder="Nombre" value="'+esc(p.nombre)+'"><input id="pa" placeholder="Apellido" value="'+esc(p.apellido)+'"><input id="pt" type="tel" placeholder="Teléfono" value="'+esc(p.telefono)+'"><input value="'+esc(st.u.email)+'" disabled><button class="btn" onclick="guardar()">Guardar datos</button>'+(st.msg?'<div class="msg">'+esc(st.msg)+'</div>':'')+'<button class="btn alt" onclick="salir()">Cerrar sesión</button>'}
function book(){
 const sv=st.svcs.find(x=>x.id==st.svc);
 if(st.done)return'<h2>Reserva confirmada</h2>'+logo+'<div class="card"><b>'+esc(sv.nombre)+'</b><div class="mut">'+dl(new Date(st.day+'T12:00'))+' · '+st.hr+'</div><div class="gold">'+money(sv.precio)+'</div></div><button class="btn" onclick="st.done=false;st.svc=st.day=st.hr=null;go(\'turns\')">Ver mis turnos</button>';
 let h='<h2>Reservar</h2><p class="mut" style="margin:0">1. Elegí tu servicio</p>'+st.svcs.map(x=>'<button class="card sv '+(st.svc==x.id?'on':'')+'" onclick="st.svc='+x.id+';render()"><div class="row"><b>'+esc(x.nombre)+'</b><span class="gold">'+money(x.precio)+'</span></div><div class="mut">'+esc(x.descripcion)+' · '+x.duracion_min+' min</div></button>').join('');
 if(st.svc)h+='<p class="mut" style="margin-top:16px">2. Elegí el día</p><div class="chips">'+days.map(d=>'<button class="chip '+(st.day==dk(d)?'on':'')+'" onclick="pickDay(\''+dk(d)+'\')">'+dl(d)+'</button>').join('')+'</div>';
 if(st.day)h+='<p class="mut" style="margin-top:12px">3. Horarios disponibles</p><div class="chips" style="flex-wrap:wrap">'+H.map(x=>'<button class="chip '+(st.hr==x?'on':'')+'" '+(st.occ.includes(x)?'disabled':'')+' onclick="st.hr=\''+x+'\';render()">'+x+'</button>').join('')+'</div>';
 return h+(st.msg?'<div class="msg">'+esc(st.msg)+'</div>':'')+'<button class="btn" '+(st.hr?'':'disabled')+' onclick="reservar()">Confirmar reserva</button>'}
function render(){
 $('app').innerHTML=view();const a=st.ready&&st.u;$('nav').hidden=!a;
 if(a)$('nav').innerHTML=[['home','⌂','Inicio'],['book','✦','Reservar'],['turns','◷','Mis turnos'],['loy','❖','Fidelización'],['me','☺','Perfil']].concat(st.adm?[['adm','⚙','Admin']]:[]).map(x=>'<button class="'+(st.tab==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')"><i>'+x[1]+'</i>'+x[2]+'</button>').join('')}
const ck=r=>{if(r.error)alert('No se pudo guardar: '+r.error.message);return r};
async function admLoad(){
 st.ad=st.ad||dk(new Date());const d0=new Date(st.ad+'T00:00:00'),d1=new Date(d0.getTime()+864e5);
 const [a,c,m,s,b]=await Promise.all([
  sb.from('turnos').select('id,inicio,estado,servicios(nombre),profiles(nombre,apellido,telefono)').gte('inicio',d0.toISOString()).lt('inicio',d1.toISOString()).order('inicio'),
  sb.from('profiles').select('id,nombre,apellido,telefono,email').order('nombre'),
  sb.from('sellos_movimientos').select('cliente_id,cantidad'),
  sb.from('servicios').select('*').order('id'),
  sb.from('bloqueos').select('inicio').gte('inicio',d0.toISOString()).lt('inicio',d1.toISOString())]);
 st.ag=a.data||[];const t={};(m.data||[]).forEach(x=>t[x.cliente_id]=(t[x.cliente_id]||0)+x.cantidad);
 st.cl=(c.data||[]).map(x=>({...x,n:Math.max(0,t[x.id]||0)}));st.sa=s.data||[];st.bl=(b.data||[]).map(x=>new Date(x.inicio).toTimeString().slice(0,5));render()}
const hh=v=>new Date(v).toTimeString().slice(0,5);
function adm(){
 st.ad=st.ad||dk(new Date());
 const T=[['ag','Agenda'],['cl','Clientas'],['sv','Servicios'],['bl','Bloqueos']];
 let h='<h2>Administración</h2><div class="chips">'+T.map(x=>'<button class="chip '+(st.at==x[0]?'on':'')+'" onclick="st.at=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div>';
 const dp='<input type="date" value="'+st.ad+'" onchange="st.ad=this.value;admLoad()">';
 if(st.at=='ag')h+=dp+((st.ag||[]).length?st.ag.map(t=>{const c=t.profiles||{};return'<div class="card"><div class="row"><b>'+hh(t.inicio)+' · '+esc(t.servicios&&t.servicios.nombre)+'</b><span class="mut">'+t.estado+'</span></div><div class="mut">'+esc(((c.nombre||'')+' '+(c.apellido||'')).trim())+' '+esc(c.telefono)+'</div>'+(t.estado=='reservado'?'<div class="row"><button class="btn" onclick="setE('+t.id+',\'realizado\')">Realizado</button><button class="btn alt" onclick="setE('+t.id+',\'cancelado\')">Cancelar</button></div>':'')+'</div>'}).join(''):'<div class="card mut">No hay turnos este día.</div>')+'<p class="mut">Al marcar Realizado, el sello se suma solo. Si lo deshacés, corregí el sello en Clientas.</p>';
 if(st.at=='cl')h+=(st.cl||[]).map(c=>'<div class="card"><div class="row"><div><b>'+esc(((c.nombre||'')+' '+(c.apellido||'')).trim()||c.email)+'</b><div class="mut">'+esc(c.telefono||c.email)+'</div></div><b class="gold">'+c.n+' / 10</b></div><div class="row"><button class="btn alt" onclick="sello(\''+c.id+'\',-1)">− 1 sello</button><button class="btn" onclick="sello(\''+c.id+'\',1)">+ 1 sello</button></div></div>').join('');
 if(st.at=='sv')h+=(st.sa||[]).map(s=>'<div class="card"><div class="mut">Nombre · Precio · Minutos</div><input id="n'+s.id+'" value="'+esc(s.nombre)+'"><input id="p'+s.id+'" type="number" inputmode="numeric" value="'+s.precio+'"><input id="m'+s.id+'" type="number" inputmode="numeric" value="'+s.duracion_min+'"><div class="row"><button class="btn" onclick="gSv('+s.id+')">Guardar</button><button class="btn alt" onclick="tSv('+s.id+','+!s.activo+')">'+(s.activo?'Ocultar':'Mostrar')+'</button></div></div>').join('')+'<div class="card"><b>Nuevo servicio</b><input id="nn" placeholder="Nombre"><input id="np" type="number" inputmode="numeric" placeholder="Precio"><input id="nm" type="number" inputmode="numeric" placeholder="Duración en minutos"><button class="btn" onclick="nSv()">Agregar</button></div>';
 if(st.at=='bl')h+=dp+'<p class="mut">Tocá un horario para bloquearlo o liberarlo.</p><div class="chips" style="flex-wrap:wrap">'+H.map(x=>'<button class="chip '+((st.bl||[]).includes(x)?'on':'')+'" onclick="bloq(\''+x+'\')">'+x+'</button>').join('')+'</div><button class="btn alt" onclick="bloqTodo()">Bloquear o liberar todo el día</button>';
 return h}
async function setE(id,e){ck(await sb.from('turnos').update({estado:e}).eq('id',id));admLoad()}
async function sello(c,n){ck(await sb.from('sellos_movimientos').insert({cliente_id:c,cantidad:n,motivo:'Ajuste manual'}));admLoad()}
async function gSv(id){ck(await sb.from('servicios').update({nombre:$('n'+id).value.trim(),precio:+$('p'+id).value,duracion_min:+$('m'+id).value}).eq('id',id));await load();admLoad()}
async function tSv(id,a){ck(await sb.from('servicios').update({activo:a}).eq('id',id));await load();admLoad()}
async function nSv(){const n=$('nn').value.trim();if(!n||!$('np').value||!$('nm').value){alert('Completá nombre, precio y duración.');return}ck(await sb.from('servicios').insert({nombre:n,precio:+$('np').value,duracion_min:+$('nm').value}));await load();admLoad()}
async function bq(x,del){const iso=new Date(st.ad+'T'+x+':00').toISOString();ck(del?await sb.from('bloqueos').delete().eq('inicio',iso):await sb.from('bloqueos').insert({inicio:iso}))}
async function bloq(x){await bq(x,st.bl.includes(x));admLoad()}
async function bloqTodo(){const all=H.every(x=>st.bl.includes(x));for(const x of H)if(all===st.bl.includes(x))await bq(x,all);admLoad()}
render();
</script></body></html>
